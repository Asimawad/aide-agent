###############################################################################
# aide_config.yaml — pre-filled with your current settings
###############################################################################
# ─── Core paths ──────────────────────────────────────────────────────────────
data_dir: null
desc_file: null
goal: null
eval: null

# ─── Workflow / bookkeeping ─────────────────────────────────────────────────
log_dir: logs
log_level: DEBUG
workspace_dir: workspaces
competition_name: "leaf-classification"
preprocess_data: true
copy_data: true
use_template: false
exp_name: null            # autogenerated when null

# ─── Runtime / execution engine ─────────────────────────────────────────────
inference_engine: vllm

exec:
  timeout: 600
  agent_file_name: runfile.py
  format_tb_ipython: false

# ─── Agent global hyper-params ──────────────────────────────────────────────
agent:
  steps: 25
  time_limit: 7200
  k_fold_validation: 5
  expose_prediction: false
  data_preview: true
  convert_system_to_user: false
  obfuscate: false
  ITS_Strategy: "code-chain" #"Baseline"  #planner

  # ── LLM settings for coding ───────────────────────────────────────────────
  code:
    model: o3-mini
    planner_model: o3-mini
    temp: 0.8
    max_new_tokens: 3200
    top_p: 0.9
    top_k: 50
    num_return_sequences: 1

  # ── LLM settings for traceback / feedback ────────────────────────────────
  feedback:
    model: o4-mini-2025-04-16
    temp: 0.5

  # ── Tree-search / debugging heuristics ───────────────────────────────────
  search:
    max_debug_depth: 50
    debug_prob: 0.65
    num_drafts: 5
  # ── ToT settings ───────────────────────────────────────────────────────────
  tot:
    planning: # Settings for ToT Phase 1 (Master Plan Generation)
      enabled: true
      method_generate: "propose"
      method_evaluate: "value"
      method_select: "greedy"
      n_generate_sample: 3
      n_evaluate_sample: 1
      n_select_sample: 1
      n_high_level_select_for_elaboration: 2
      max_steps: 1
      evaluator_model_name: "o3-mini" # Explicitly use o3-mini for evaluating plans
                                      # If null or not present, ToTAgent will use agent.feedback.model

    segment_coding: # Settings for ToT Phase 2 (Code Segment Generation) - we'll use later
      enabled: true
      method_generate: "propose"
      method_evaluate: "value"
      method_select: "greedy"
      n_generate_sample: 3
      n_evaluate_sample: 1
      n_select_sample: 2
      max_steps: 1
      evaluator_model_name: "o3-mini" # Explicitly use o3-mini for evaluating plans
      inter_segment_beam_width: 2 
# ─── W&B experiment tracking ────────────────────────────────────────────────
wandb:
  enabled: true
  project: "MLE_BENCH_AIDE"
  entity: null
  run_name: null
  log_code: true
  log_artifacts: true
