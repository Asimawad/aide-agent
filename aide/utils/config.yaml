###############################################################################
# aide_config.yaml — pre-filled with your current settings
###############################################################################
# ─── Core paths ──────────────────────────────────────────────────────────────
data_dir: null
desc_file: null
goal: null
eval: null

# ─── Workflow / bookkeeping ─────────────────────────────────────────────────
log_dir: logs
log_level: DEBUG
workspace_dir: workspaces
competition_name: "leaf-classification"
preprocess_data: true
copy_data: true
use_template: false
exp_name: null            # autogenerated when null

# ─── Runtime / execution engine ─────────────────────────────────────────────
inference_engine: vllm

exec:
  timeout: 600
  agent_file_name: runfile.py
  format_tb_ipython: false

# ─── Agent global hyper-params ──────────────────────────────────────────────
agent:
  steps: 25
  time_limit: 7200
  k_fold_validation: 5
  expose_prediction: false
  data_preview: true
  convert_system_to_user: false
  obfuscate: false
  ITS_Strategy: "code-chain" #"Baseline"  #planner

  # ── LLM settings for coding ───────────────────────────────────────────────
  code:
    model: o3-mini
    planner_model: o3-mini
    temp: 0.8
    max_new_tokens: 3200
    top_p: 0.9
    top_k: 50
    num_return_sequences: 1

  # ── LLM settings for traceback / feedback ────────────────────────────────
  feedback:
    model: o4-mini-2025-04-16
    temp: 0.5

  # ── Tree-search / debugging heuristics ───────────────────────────────────
  search:
    max_debug_depth: 50
    debug_prob: 0.65
    num_drafts: 5
  # ── ToT settings ───────────────────────────────────────────────────────────
  tot:
    enabled: true
    method_generate: "propose"
    method_evaluate: "value"
    method_select: "greedy"
    n_generate_sample: 3       # Number of thoughts to generate from each state (k in paper, but their run.py calls it this)
    n_evaluate_sample: 1       # Number of LLM calls for evaluation per thought (for robustness, 1 is fine to start)
    n_select_sample: 1         # Beam width for BFS (b in paper)
    max_steps: 1
# ─── W&B experiment tracking ────────────────────────────────────────────────
wandb:
  enabled: true
  project: "MLE_BENCH_AIDE"
  entity: null
  run_name: null
  log_code: true
  log_artifacts: true
